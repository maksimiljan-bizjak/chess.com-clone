<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="chess.ico" type="image/x-icon">
  <title>Create account</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <a class="brand" href="index.html"><img src="logo.svg" alt="Chess logo"></a>
    <section class="card register-card">
      <h1>Create your account</h1>
      <p class="sub">Join and start practicing.</p>
      <form>
        <label class="sr-only" for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Choose a username">
        <label class="sr-only" for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Email">
        <label class="sr-only" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Create a password">
        <button class="primary" type="submit">Create account</button>
      </form>
      <div class="or"><span>OR</span></div>
      <div class="socials">
        <a class="social apple" href="https://www.chess.com/register"><img class="provider-icon" src="apple.svg" alt="">Continue with Apple</a>
        <a class="social google" href="https://www.chess.com/register"><img class="provider-icon" src="google.svg" alt="">Continue with Google</a>
        <a class="social facebook" href="https://www.chess.com/register"><img class="provider-icon" src="facebook.svg" alt="">Continue with Facebook</a>
      </div>
      <a class="footer" href="index.html">Already have an account? Log in</a>
    </section>
  </main>
</body>

</html>

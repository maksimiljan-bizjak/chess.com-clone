<!DOCTYPE html>
<html lang="sl">

<head>
    <link rel="icon" href="chess.ico" type="image/icon-x">
    <title>Login - Chess.com</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <div id="sahovnica"></div>
   <a id="logo" href="https://www.chess.com"><img src="logo.svg" alt="logo" width="158" ></a>
   <div id="glavni">
        <form id="form" novalidate>
        <h1 id="title" hidden></h1>

        <label class="field">
          <span class="sr">Username, phone, or email</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.2"></circle>
            <path d="M5 19.2c1.4-3 3.8-4.5 7-4.5s5.6 1.5 7 4.5"></path>
          </svg>
          <input id="identity" name="identity" autocomplete="username" placeholder="Username, Phone, or Email">
        </label>

        <label class="field" id="password-wrap">
          <span class="sr">Password</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5.5" y="10.5" width="13" height="9" rx="2"></rect>
            <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path>
          </svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password">
          <button class="eye" type="button" id="toggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12S6.2 6.5 12 6.5 21.5 12 21.5 12 17.8 17.5 12 17.5 2.5 12 2.5 12Z"></path>
              <circle cx="12" cy="12" r="2.4"></circle>
              <path id="slash" d="M4 19 20 5" hidden></path>
            </svg>
          </button>
        </label>

        <div class="row" id="login-row">
          <label class="remember">
            <input id="remember" type="checkbox" checked>
            Remember me
          </label>
          <button class="link" type="button" id="forgot">Forgot Password?</button>
        </div>
        <button class="link back" type="button" id="back" hidden>Back to log in</button>

        <button class="submit" type="submit" id="submit">Log In</button>
        <p class="notice" id="notice" role="status" hidden></p>

        <div id="social">
          <div class="or"><span></span>OR<span></span></div>
          <button class="social" type="button" data-provider="Apple">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.7-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8s-1.8-.8-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.2c.6-.9 1.1-1.8 1.4-2.8-3.6-1.4-3.9-5.1-3.9-5.4zM14.7 6.3c.6-.8 1.1-1.8.9-2.9-1 .1-2.1.6-2.8 1.4-.6.7-1.2 1.8-1 2.8 1.1.1 2.2-.5 2.9-1.3z"></path></svg>
            Log in with Apple
          </button>
          <button class="social" type="button" data-provider="Google">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"></path>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"></path>
              <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"></path>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.7 7.1l6.3 5.3C37.4 38.3 44 33 44 24c0-1.2-.1-2.3-.4-3.5z"></path>
            </svg>
            Log in with Google
          </button>
          <button class="social" type="button" data-provider="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10" fill="#1877F2"></circle>
              <path fill="#fff" d="M13.4 18.5v-5.2h1.7l.3-1.9h-2V10.2c0-.6.2-1 .9-1h1.2V7.5c-.2 0-.9-.1-1.7-.1-1.7 0-2.8 1-2.8 2.9v1.6H9.3v1.9h1.7v5.2h2.4z"></path>
            </svg>
            Log in with Facebook
          </button>
        </div>
      </form>
        <div id="registracija">
            <a id="reg">New? Sign up - and start playing chess!</a>
        </div>
   </div>

</body>

</html>

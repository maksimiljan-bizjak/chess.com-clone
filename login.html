<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="chess.ico" type="image/x-icon">
  <title>Log in</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <a class="brand" href="login.html"><img src="logo.svg" alt="Chess logo, demo page"></a>
    <section class="card">
      <form>
        <label class="sr-only" for="email">Username, phone, or email</label>
        <input id="email" name="email" type="text" placeholder="Username, phone, or email">
        <label class="sr-only" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password">
        <div class="options"><label class="remember"><input type="checkbox" name="remember"> <span>Remember me</span>
            </label><a class="forgot" href="forgot-password.html">Forgot password?</a></div>
        <button class="primary" type="submit">Log in</button>
      </form>
      <div class="or"><span>OR</span></div>
      <div class="socials">
        <a class="social apple" href="https://www.chess.com/login/apple"><img class="provider-icon" src="apple.svg" alt="">Log in with Apple</a>
        <a class="social google" href="https://www.chess.com/login/google"><img class="provider-icon" src="google.svg" alt="">Log in with Google</a>
        <a class="social facebook" href="https://www.chess.com/login-facebook"><img class="provider-icon" src="facebook.svg" alt="">Log in with Facebook</a>
      </div>
      <a class="footer" href="register.html">New? Sign up and start playing chess!</a>
    </section>
  </main>
</body>

</html>

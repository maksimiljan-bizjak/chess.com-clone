<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="chess.ico" type="image/x-icon">
  <title>Forgot password</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <a class="brand" href="index.html"><img src="logo.svg" alt="Chess logo"></a>
    <section class="card recovery-card">
      <h1>Forgot your password?</h1>
      <p class="sub">Enter your email or username to continue.</p>
      <form>
        <label class="sr-only" for="account">Email or username</label>
        <input id="account" name="account" type="text" placeholder="Email or username">
        <button class="primary" type="submit">Send instructions</button>
      </form>
      <a class="footer" href="index.html">Back to log in</a>
    </section>
  </main>
</body>

</html>
